# -----------------------------------------------------------------------------
# Kubernetes resources for the app.
#
#   Internet --> NLB (created by Terraform, port 80)
#            --> worker node port 30080  (this Service, type NodePort)
#            --> pod port 8080           (this Deployment's containers)
#
# IMAGE_PLACEHOLDER is replaced with the real ECR image by the pipeline
# (or by the sed command in the README) before `kubectl apply`.
# -----------------------------------------------------------------------------

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ugallin-app
  labels:
    app: ugallin-app
spec:
  replicas: 2 # two pods, so the app keeps running if one restarts
  selector:
    matchLabels:
      app: ugallin-app
  template:
    metadata:
      labels:
        app: ugallin-app
    spec:
      containers:
        - name: ugallin-app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          # Kubernetes sends traffic to a pod only when this check succeeds.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          # Kubernetes restarts the container if this check keeps failing.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          # requests = reserved for the pod, limits = the most it may use
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
# A NodePort Service opens the same fixed port (30080) on every worker node and
# forwards it to the pods. The Terraform NLB sends internet traffic to that port.
apiVersion: v1
kind: Service
metadata:
  name: ugallin-app
  labels:
    app: ugallin-app
spec:
  type: NodePort
  selector:
    app: ugallin-app
  ports:
    - port: 80 # port inside the cluster
      targetPort: 8080 # port of the container
      nodePort: 30080 # port on every node - must match var.node_port in Terraform
